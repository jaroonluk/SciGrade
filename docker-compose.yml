services:
  scigrade-fpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scigrade-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    environment:
      APP_URL: ${APP_URL:-https://gms.sc.kku.ac.th}
      # Prefer .env; do not default to host.docker.internal (no MySQL on host:3306)
      SCIGRAD_DB_HOST: ${SCIGRAD_DB_HOST:-10.104.177.79}
      SCIGRAD_DB_PORT: ${SCIGRAD_DB_PORT:-3306}
      SCIGRAD_DB_DATABASE: ${SCIGRAD_DB_DATABASE:-eoffice}
      SCIGRAD_DB_USERNAME: ${SCIGRAD_DB_USERNAME:-devsc}
      SCIGRAD_DB_PASSWORD: ${SCIGRAD_DB_PASSWORD:-}
      REG_DB_HOST: ${REG_DB_HOST:-10.104.177.79}
      REG_DB_PORT: ${REG_DB_PORT:-3306}
      REG_DB_DATABASE: ${REG_DB_DATABASE:-reg}
      REG_DB_USERNAME: ${REG_DB_USERNAME:-devsc}
      REG_DB_PASSWORD: ${REG_DB_PASSWORD:-}
    networks:
      - scigrade

  nginx:
    image: nginx:alpine
    container_name: my-SciGrade
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scigrade-fpm
    networks:
      - scigrade

networks:
  scigrade:
    driver: bridge
